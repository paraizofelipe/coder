description: "Sintetiza as decisões já tomadas (.coder/plan-<branch>.md ou a conversa atual) em um spec executável gravado em .coder/spec-<timestamp>.md. Não entrevista — a única pergunta é a confirmação das seams antes de escrever. Use depois de /planning, quando o trabalho não cabe em uma única sessão. Uso: /to-spec  ou  /to-spec <foco/escopo opcional>"
